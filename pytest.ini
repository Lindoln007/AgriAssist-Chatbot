[pytest]
DJANGO_SETTINGS_MODULE = AgriAssistant.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Test
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --reuse-db
testpaths = 
    chatbot
    reminders
    policy_updates
    weather
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    authentication: Authentication tests

