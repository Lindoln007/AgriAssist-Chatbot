<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Selection - AgriAssist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2F855A;
            --primary-dark: #22543D;
            --bg-color: #FDFBF7;
            --text-main: #2D3748;
            --text-light: #A0AEC0;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#2F855A 0.5px, transparent 0.5px), radial-gradient(#2F855A 0.5px, var(--bg-color) 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 48px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.5s ease-out;
            text-align: center;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 15px -3px rgba(47, 133, 90, 0.3);
            transform: rotate(-5deg);
        }

        h1 {
            color: var(--primary-dark);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-light);
            font-size: 15px;
            margin-bottom: 40px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 500px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-card {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 20px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .option-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -5px rgba(47, 133, 90, 0.15);
        }

        .option-icon {
            width: 60px;
            height: 60px;
            background: #F0FDF4;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s;
        }

        .option-card:hover .option-icon {
            background: var(--primary);
            color: white;
        }

        .option-title {
            font-weight: 600;
            font-size: 18px;
        }

        .option-desc {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-icon">
            <i class="fas fa-leaf"></i>
        </div>
        <h1>Welcome to AgriAssist</h1>
        <p>Please select your login type to continue</p>

        <div class="options-grid">
            <a href="{% url 'chatbot:user_login' %}" class="option-card">
                <div class="option-icon">
                    <i class="fas fa-user"></i>
                </div>
                <div class="option-title">User Login</div>
                <div class="option-desc">Access the chatbot and agricultural tools</div>
            </a>

            <a href="{% url 'chatbot:admin_login' %}" class="option-card">
                <div class="option-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="option-title">Admin Login</div>
                <div class="option-desc">Manage users and system settings</div>
            </a>
        </div>
    </div>
</body>

</html>
