<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Visit - {{ farmer.name }}</title>
    <!-- Same CSS as farmer form -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2F855A;
            --primary-dark: #22543D;
            --bg-color: #FDFBF7;
            --sidebar-bg: #1C4532;
            --text-main: #2D3748;
            --text-light: #A0AEC0;
            --card-bg: #FFFFFF;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1A202C;
            --card-bg: #2D3748;
            --text-main: #F7FAFC;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            color: var(--text-main);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .subtitle {
            color: var(--text-light);
            margin-bottom: 20px;
            margin-top: -15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-family: inherit;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            margin-right: 10px;
        }
    </style>
</head>

<body>
    {% include 'includes/sidebar.html' with current_module='farmers' %}

    <div class="main-content">
        <div class="form-container">
            <h1><i class="fas fa-clipboard-check"></i> Log Field Visit</h1>
            <p class="subtitle">For Farmer: <strong>{{ farmer.name }}</strong></p>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Date of Visit</label>
                    <input type="date" name="visit_date" required value="{% now 'Y-m-d' %}">
                </div>

                <div class="form-group">
                    <label>Purpose of Visit</label>
                    <input type="text" name="purpose" list="purposes" required placeholder="e.g. Routine Inspection">
                    <datalist id="purposes">
                        <option value="Routine Inspection">
                        <option value="Pest/Disease Check">
                        <option value="Harvest Assessment">
                        <option value="Input Distribution">
                        <option value="Training Follow-up">
                    </datalist>
                </div>

                <div class="form-group">
                    <label>Key Observations</label>
                    <textarea name="observations" rows="4" required
                        placeholder="What did you see? Crop health, issues, etc."></textarea>
                </div>

                <div class="form-group">
                    <label>Recommendations Given</label>
                    <textarea name="recommendations" rows="3" placeholder="Advice given to the farmer..."></textarea>
                </div>

                <div class="form-group">
                    <label>Follow-up Date (Optional)</label>
                    <input type="date" name="follow_up_date">
                </div>

                <div style="margin-top: 30px;">
                    <a href="{% url 'farmers:detail' farmer.id %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Visit Log</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
