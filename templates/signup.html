<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AgriAssist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2F855A;
            --primary-dark: #22543D;
            --bg-color: #FDFBF7;
            --text-main: #2D3748;
            --text-light: #A0AEC0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#2F855A 0.5px, transparent 0.5px), radial-gradient(#2F855A 0.5px, var(--bg-color) 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text-main);
        }

        .container { width:100%; max-width:480px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-radius:20px; padding:44px; box-shadow:0 20px 30px rgba(0,0,0,0.08); border:1px solid rgba(255,255,255,0.6); }
        .logo { text-align:center; margin-bottom:28px; }
        .logo-icon { width:64px; height:64px; background:var(--primary); color:white; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 14px; transform:rotate(-6deg); }
        .logo h1 { color:var(--primary-dark); font-size:22px; font-weight:700; margin-bottom:6px; }
        .logo p { color:var(--text-light); font-size:14px; }
        .form-group { margin-bottom:18px; }
        label { display:block; margin-bottom:8px; color:var(--text-main); font-weight:600; font-size:13px; margin-left:4px; }
        .input-wrapper { position:relative; }
        .input-wrapper i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-light); }
        input, select { width:100%; padding:14px 16px 14px 44px; border:2px solid #E6EDF0; border-radius:14px; font-size:14px; background:#F8FAFC; color:var(--text-main); transition:all 0.2s; font-family:inherit; }
        input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(47,133,90,0.06); }
        .submit-btn { width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
        .submit-btn:hover { background:var(--primary-dark); transform:translateY(-2px); }
        .error-message { display:none; background:#FFF5F5; color:#C53030; padding:12px; border-radius:12px; margin-bottom:16px; border:1px solid #FED7D7; }
        .loading { display:none; margin-top:12px; color:var(--primary); }
        .link { text-align:center; margin-top:18px; color:var(--text-light); }
        .link a { color:var(--primary); text-decoration:none; font-weight:600; }
        .back-link { display:block; color:var(--text-light); margin-bottom:12px; text-decoration:none; }
    </style>
</head>

<body>
    <div class="container">
        <a href="{% url 'chatbot:login_selection' %}" class="back-link"><i class="fas fa-arrow-left"></i> Back to selection</a>

        <div class="logo">
            <div class="logo-icon"><i class="fas fa-leaf"></i></div>
            <h1>Create your AgriAssist account</h1>
            <p>Sign up to get personalized farming help</p>
        </div>

        <div class="error-message" id="error-message"></div>

        <form id="signup-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="location" name="location" placeholder="e.g., Lilongwe District">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="display_name">Display name (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="display_name" name="display_name" placeholder="How you'd like to be addressed">
                    <i class="fas fa-id-badge"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="specialization">Specialization (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="specialization" name="specialization" placeholder="e.g., Crop Management">
                    <i class="fas fa-seedling"></i>
                </div>
            </div>

            <button type="submit" class="submit-btn">Sign Up <i class="fas fa-arrow-right"></i></button>
            <div class="loading" id="loading"><i class="fas fa-circle-notch fa-spin"></i> Creating your account...</div>
        </form>

        <div class="link">Already have an account? <a href="{% url 'chatbot:user_login' %}">Sign In</a></div>
    </div>

    <script>
        const form = document.getElementById('signup-form');
        const errorMessage = document.getElementById('error-message');
        const loadingDiv = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            loadingDiv.style.display = 'block';

            const formData = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                location: document.getElementById('location').value.trim(),
                specialization: document.getElementById('specialization').value.trim(),
                display_name: document.getElementById('display_name').value.trim(),
            };

            try {
                const response = await fetch('{% url "chatbot:signup" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect to home
                    window.location.href = '{% url "chatbot:home" %}';
                } else {
                    errorMessage.textContent = data.error || 'An error occurred';
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>

</html>
