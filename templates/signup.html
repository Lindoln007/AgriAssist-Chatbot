<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AgriAssist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/global-styles.css">
    <style>
        :root {
            --primary: #2F855A;
            --primary-dark: #22543D;
            --bg-color: #FDFBF7;
            --text-main: #2D3748;
            --text-light: #A0AEC0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #FDFBF7 0%, #F0FDF4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(47, 133, 90, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: backgroundMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1A202C 0%, #171923 100%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 1;
            animation: containerEntry 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        [data-theme="dark"] .container {
            background: rgba(45, 55, 72, 0.95);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #2F855A 0%, #48BB78 100%);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            transform: rotate(-6deg);
            box-shadow: 0 15px 30px -8px rgba(47, 133, 90, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: iconFloat 3s ease-in-out infinite;
        }

        .logo-icon:hover {
            transform: rotate(0deg) scale(1.05);
        }

        @keyframes iconFloat {
            0%, 100% { transform: rotate(-6deg) translateY(0); }
            50% { transform: rotate(-6deg) translateY(-5px); }
        }

        .logo h1 {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .logo p {
            color: var(--text-light);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 13px;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-wrapper:focus-within i {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 2px solid #E6EDF0;
            border-radius: 14px;
            font-size: 14px;
            background: #F8FAFC;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(47, 133, 90, 0.12), 0 4px 12px rgba(47, 133, 90, 0.1);
            transform: translateY(-1px);
            background: white;
        }

        [data-theme="dark"] input {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="dark"] input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2F855A 0%, #48BB78 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 16px -4px rgba(47, 133, 90, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -6px rgba(47, 133, 90, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            display: none;
            background: linear-gradient(135deg, #FFF5F5 0%, #FED7D7 100%);
            color: #C53030;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #FEB2B2;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        [data-theme="dark"] .error-message {
            background: rgba(254, 178, 178, 0.1);
            border-color: rgba(254, 178, 178, 0.3);
        }

        .loading {
            display: none;
            margin-top: 14px;
            color: var(--primary);
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
            font-size: 14px;
        }

        .link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .back-link:hover {
            color: var(--primary);
            background: rgba(47, 133, 90, 0.05);
            transform: translateX(-4px);
        }

        .back-link i {
            transition: transform 0.2s;
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="{% url 'chatbot:login_selection' %}" class="back-link"><i class="fas fa-arrow-left"></i> Back to selection</a>

        <div class="logo">
            <div class="logo-icon"><i class="fas fa-leaf"></i></div>
            <h1>Create your AgriAssist account</h1>
            <p>Sign up to get personalized farming help</p>
        </div>

        <div class="error-message" id="error-message"></div>

        <form id="signup-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="location" name="location" placeholder="e.g., Lilongwe District">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="display_name">Display name (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="display_name" name="display_name" placeholder="How you'd like to be addressed">
                    <i class="fas fa-id-badge"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="specialization">Specialization (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="specialization" name="specialization" placeholder="e.g., Crop Management">
                    <i class="fas fa-seedling"></i>
                </div>
            </div>

            <button type="submit" class="submit-btn">Sign Up <i class="fas fa-arrow-right"></i></button>
            <div class="loading" id="loading"><i class="fas fa-circle-notch fa-spin"></i> Creating your account...</div>
        </form>

        <div class="link">Already have an account? <a href="{% url 'chatbot:user_login' %}">Sign In</a></div>
    </div>

    <script src="/static/js/global-utils.js"></script>
    <script>
        const form = document.getElementById('signup-form');
        const errorMessage = document.getElementById('error-message');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = form.querySelector('.submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;

            const formData = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                location: document.getElementById('location').value.trim(),
                specialization: document.getElementById('specialization').value.trim(),
                display_name: document.getElementById('display_name').value.trim(),
            };

            try {
                const response = await fetch('{% url "chatbot:signup" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Account Created!';
                    submitBtn.style.background = 'linear-gradient(135deg, #48BB78 0%, #68D391 100%)';
                    
                    setTimeout(() => {
                        window.location.href = '{% url "chatbot:home" %}';
                    }, 500);
                } else {
                    errorMessage.textContent = data.error || 'An error occurred';
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
            } finally {
                if (!submitBtn.innerHTML.includes('Created')) {
                    loadingDiv.style.display = 'none';
                }
            }
        });

        // Add enter animation to form elements
        document.querySelectorAll('.form-group').forEach((group, index) => {
            group.style.opacity = '0';
            group.style.animation = `slideUp 0.5s ease-out ${index * 0.08}s forwards`;
        });
    </script>
</body>

</html>
