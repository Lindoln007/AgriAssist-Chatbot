<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title|default:"Sign In - AgriAssist" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/global-styles.css">
    <style>
        :root {
            --primary: #2F855A;
            --primary-dark: #22543D;
            --primary-light: #48BB78;
            --accent: #F6E05E;
            --bg-color: #FDFBF7;
            --text-main: #2D3748;
            --text-light: #A0AEC0;
            --white: #FFFFFF;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #FDFBF7 0%, #F0FDF4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(47, 133, 90, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: backgroundMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1A202C 0%, #171923 100%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 52px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 1;
            animation: containerEntry 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        [data-theme="dark"] .container {
            background: rgba(45, 55, 72, 0.95);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #2F855A 0%, #48BB78 100%);
            color: white;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 15px 30px -8px rgba(47, 133, 90, 0.4);
            transform: rotate(-6deg);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: iconFloat 3s ease-in-out infinite;
        }

        .logo-icon:hover {
            transform: rotate(0deg) scale(1.05);
        }

        @keyframes iconFloat {
            0%, 100% { transform: rotate(-6deg) translateY(0); }
            50% { transform: rotate(-6deg) translateY(-5px); }
        }

        .logo h1 {
            color: var(--primary-dark);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: var(--text-light);
            font-size: 15px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 14px;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
        }

        .input-wrapper:focus-within i {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        input {
            width: 100%;
            padding: 15px 18px 15px 48px;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #F8FAFC;
            font-family: inherit;
            color: var(--text-main);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 5px rgba(47, 133, 90, 0.12), 0 4px 12px rgba(47, 133, 90, 0.1);
            transform: translateY(-1px);
        }

        [data-theme="dark"] input {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="dark"] input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #2F855A 0%, #48BB78 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            box-shadow: 0 8px 16px -4px rgba(47, 133, 90, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -6px rgba(47, 133, 90, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -3px rgba(47, 133, 90, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: linear-gradient(135deg, #FFF5F5 0%, #FED7D7 100%);
            color: #C53030;
            padding: 16px 18px;
            border-radius: 14px;
            margin-bottom: 24px;
            display: none;
            border: 1px solid #FEB2B2;
            font-size: 14px;
            align-items: center;
            gap: 12px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        [data-theme="dark"] .error-message {
            background: rgba(254, 178, 178, 0.1);
            border-color: rgba(254, 178, 178, 0.3);
        }

        .link {
            text-align: center;
            margin-top: 32px;
            color: var(--text-light);
            font-size: 14px;
        }

        .link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--primary);
            font-size: 14px;
            margin-top: 16px;
            font-weight: 500;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .back-link:hover {
            color: var(--primary);
            background: rgba(47, 133, 90, 0.05);
            transform: translateX(-4px);
        }

        .back-link i {
            transition: transform 0.2s;
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="{% url 'chatbot:login_selection' %}" class="back-link"><i class="fas fa-arrow-left"></i> Back to
            selection</a>

        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-leaf"></i>
            </div>
            <h1>{{ header_title|default:"AgriAssist" }}</h1>
            <p>{{ welcome_text|default:"Welcome back! Please sign in to continue." }}</p>
        </div>

        <div class="error-message" id="error-message" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text"></span>
        </div>

        <form id="login-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Enter your username" required
                        autofocus>
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Sign In <i class="fas fa-arrow-right"></i>
            </button>
            <div class="loading" id="loading">
                <i class="fas fa-circle-notch fa-spin"></i> Signing in...
            </div>
        </form>

        {% if show_signup_link %}
        <div class="link">
            Don't have an account? <a href="{% url 'chatbot:signup' %}">Create Account</a>
        </div>
        {% endif %}
    </div>

    <script src="/static/js/global-utils.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = form.querySelector('.submit-btn');

        // Add floating label effect
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('focused');
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.classList.remove('focused');
                }
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMessage.style.display = 'none';
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;

            const formData = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
            };

            try {
                const response = await fetch('{{ submit_url }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Show success state
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Success!';
                    submitBtn.style.background = 'linear-gradient(135deg, #48BB78 0%, #68D391 100%)';
                    
                    setTimeout(() => {
                        window.location.href = data.redirect_url || '{% url "chatbot:home" %}';
                    }, 500);
                } else {
                    errorText.textContent = data.error || 'Invalid username or password';
                    errorMessage.style.display = 'flex';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                errorText.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'flex';
                submitBtn.disabled = false;
            } finally {
                if (!submitBtn.innerHTML.includes('Success')) {
                    loadingDiv.style.display = 'none';
                }
            }
        });

        // Add enter animation to form elements
        document.querySelectorAll('.form-group').forEach((group, index) => {
            group.style.opacity = '0';
            group.style.animation = `slideUp 0.5s ease-out ${index * 0.1}s forwards`;
        });
    </script>
</body>

</html>
