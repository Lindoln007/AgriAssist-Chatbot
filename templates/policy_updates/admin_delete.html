<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Update - AgriAssist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2F855A;
            --primary-dark: #22543D;
            --primary-light: #48BB78;
            --accent: #F6E05E;
            --bg-color: #FDFBF7;
            --sidebar-bg: #1C4532;
            --text-main: #2D3748;
            --text-light: #A0AEC0;
            --white: #FFFFFF;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-color: rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --danger: #E53E3E;
        }

        [data-theme="dark"] {
            --bg-color: #1A202C;
            --sidebar-bg: #171923;
            --text-main: #F7FAFC;
            --text-light: #A0AEC0;
            --white: #2D3748;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --border-color: rgba(255, 255, 255, 0.1);
            --card-bg: #2D3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .sidebar-header h2 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        [data-theme="dark"] .header h1 {
            color: var(--primary-light);
        }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            transform: scale(1.1);
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
        }

        .confirm-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 500px;
            margin: 40px auto;
            text-align: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="{% url 'chatbot:home' %}" style="text-decoration:none; color:inherit;">
                <h2><i class="fas fa-leaf"></i> AgriAssist</h2>
            </a>
        </div>
        <nav>
            <a href="{% url 'chatbot:home' %}" class="nav-link">
                <i class="fas fa-comments"></i> Chatbot
            </a>
            <a href="{% url 'reminders:index' %}" class="nav-link">
                <i class="fas fa-calendar-alt"></i> Farm Calendar
            </a>
            <a href="{% url 'policy_updates:user_list' %}" class="nav-link">
                <i class="fas fa-landmark"></i> Government Updates
            </a>
            {% if user.is_staff %}
            <a href="{% url 'policy_updates:admin_list' %}" class="nav-link active">
                <i class="fas fa-cog"></i> Manage Updates
            </a>
            <a href="/admin/" class="nav-link">
                <i class="fas fa-shield-alt"></i> Admin Panel
            </a>
            {% endif %}
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Delete Update</h1>
            <button id="theme-toggle-btn" class="header-btn">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <div class="content-scroll">
            <div class="confirm-card">
                <div style="font-size: 48px; color: var(--danger); margin-bottom: 20px;">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2 style="margin-bottom: 15px;">Are you sure?</h2>
                <p style="color: var(--text-light); margin-bottom: 30px;">
                    You are about to delete the update: <br>
                    <strong>"{{ update.title }}"</strong>
                </p>
                <form method="POST">
                    {% csrf_token %}
                    <a href="{% url 'policy_updates:admin_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIcon = themeToggleBtn.querySelector('i');
        const savedTheme = localStorage.getItem('chatbot_theme') || 'light';

        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('chatbot_theme', 'light');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('chatbot_theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
        });
    </script>
</body>

</html>
